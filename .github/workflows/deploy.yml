# Автодеплой: после push в main GitHub вызывает deploy.php на сайте,
# а тот сам скачивает свежий main с GitHub и раскладывает файлы.
# Секрет DEPLOY_TOKEN — тот же токен, чей SHA-256 записан в deploy.php.
# Переменные (необязательно):
#   DEPLOY_URL  — адрес deploy.php (по умолчанию https://ledijazz.ru/deploy.php)
#   DEPLOY_HOST — заголовок Host для запроса по IP (по умолчанию ledijazz.ru)

name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ledijazz
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Попросить сайт обновиться с GitHub
        env:
          URL: ${{ vars.DEPLOY_URL || 'https://ledijazz.ru/deploy.php' }}
          HOST: ${{ vars.DEPLOY_HOST || 'ledijazz.ru' }}
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::Нет секрета DEPLOY_TOKEN — добавьте его в Settings → Secrets"; exit 1; }
          echo "→ $URL (Host: $HOST)"
          code=$(curl -sS -o resp.txt -w '%{http_code}' --max-time 300 -X POST \
                 -H "Host: $HOST" -H "X-Deploy-Token: $TOKEN" "$URL") || code=000
          cat resp.txt; echo
          [ "$code" = "200" ] || { echo "::error::deploy.php ответил HTTP $code"; exit 1; }

      - name: Проверить, что сайт отдаёт страницы
        env:
          URL: ${{ vars.DEPLOY_URL || 'https://ledijazz.ru/deploy.php' }}
          HOST: ${{ vars.DEPLOY_HOST || 'ledijazz.ru' }}
        run: |
          base="${URL%/deploy.php}"; fail=0
          for p in / /shop.html /checkout.html /crm.html /assets/css/styles.css /assets/js/shop.js /assets/brand/vk/cover-1590x530.jpg; do
            code=$(curl -sS -o page.bin -w '%{http_code}' --max-time 30 -H "Host: $HOST" "$base$p") || code=000
            title=$(grep -o '<title>[^<]*' page.bin 2>/dev/null | head -1 | sed 's/<title>//')
            printf '%-42s HTTP %s  %s\n' "$p" "$code" "$title"
            [ "$code" = "200" ] || fail=1
          done
          echo "--- редиректы на основной домен ---"
          printf '%-28s ' 'http://ledijazz.ru'; curl -sS -o /dev/null -w 'HTTP %{http_code} → %{redirect_url}\n' --max-time 30 http://ledijazz.ru/ || true
          printf '%-28s ' 'https://www.ledijazz.ru'; curl -sS -o /dev/null -w 'HTTP %{http_code} → %{redirect_url}\n' --max-time 30 https://www.ledijazz.ru/ || true
          printf '%-28s ' 'http://www.ledijazz.ru'; curl -sS -o /dev/null -w 'HTTP %{http_code} → %{redirect_url}\n' --max-time 30 http://www.ledijazz.ru/ || true
          [ $fail = 0 ] || { echo "::error::Часть страниц не отдаётся"; exit 1; }

      - name: SSL и HTTPS (информационно)
        run: |
          echo "--- https://ledijazz.ru ---"
          if curl -sS -o /dev/null -w 'HTTPS: HTTP %{http_code}, проверка сертификата=%{ssl_verify_result} (0 = валиден)\n' --max-time 30 https://ledijazz.ru/; then
            echo | openssl s_client -connect ledijazz.ru:443 -servername ledijazz.ru 2>/dev/null \
              | openssl x509 -noout -issuer -dates -ext subjectAltName | sed 's/^/  /'
            echo "  проверка www:"; curl -sS -o /dev/null -w '    www: HTTP %{http_code} verify=%{ssl_verify_result}\n' --max-time 20 https://www.ledijazz.ru/ || echo "    www: сертификат не покрывает www.ledijazz.ru"
          else
            echo "::warning::HTTPS недоступен или сертификат не доверенный"
          fi
          echo "--- IPv6 ---"
          curl -6 -sS -o /dev/null -w 'IPv6: HTTP %{http_code}\n' --max-time 20 http://ledijazz.ru/ || echo "IPv6: недоступен с раннера (не критично)"
