# Автодеплой сайта на хостинг REG.RU по FTP.
# Запускается при каждом push в main и вручную (Actions → Deploy → Run workflow).
#
# Нужные секреты (Settings → Secrets and variables → Actions → New repository secret):
#   FTP_HOST      — адрес FTP-сервера хостинга, напр. sm30.hosting.reg.ru
#   FTP_USER      — логин хостинга, напр. u3534471
#   FTP_PASSWORD  — пароль хостинга
# Необязательные переменные (вкладка Variables):
#   FTP_SERVER_DIR — папка сайта на сервере (по умолчанию /www/ledijazz.ru/)
#   FTP_PROTOCOL   — ftp | ftps (по умолчанию ftp)

name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ledijazz
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ vars.FTP_SERVER_DIR || '/www/ledijazz.ru/' }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/*.md
            .claude/**
