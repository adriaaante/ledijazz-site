# Автодеплой сайта на хостинг REG.RU.
# Запускается при каждом push в main и вручную (Actions → Deploy → Run workflow).
#
# Секреты (Settings → Secrets and variables → Actions → Secrets):
#   FTP_HOST      — адрес сервера из раздела «Доступы» (без https:// и без порта)
#   FTP_USER      — логин FTP/SFTP
#   FTP_PASSWORD  — пароль FTP/SFTP
#
# Переменные (вкладка Variables) — все необязательные:
#   DEPLOY_METHOD  — auto (по умолчанию: пробует sftp → ftp → ftps) | sftp | ftp | ftps
#   DEPLOY_PATH    — папка сайта на сервере (по умолчанию www/ledijazz.ru)
#   DEPLOY_PORT    — порт SFTP (по умолчанию 22)

name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ledijazz
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Сервер REG.RU отклоняет FTP/SSH-подключения с IP GitHub (ограничение по
    # странам). Пока поддержка REG.RU не откроет доступ, автозапуск выключен.
    # Как откроют — создайте переменную DEPLOY_ENABLED = true
    # (Settings → Secrets and variables → Actions → Variables).
    if: vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    env:
      METHOD: ${{ vars.DEPLOY_METHOD || 'auto' }}
      SITE_PATH: ${{ vars.DEPLOY_PATH || 'www/ledijazz.ru' }}
      SSH_PORT: ${{ vars.DEPLOY_PORT || '22' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Собрать чистую папку для выкладки
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' --exclude='.github/' --exclude='.claude/' \
            --exclude='_site/' --exclude='*.md' \
            ./ _site/
          echo "Файлов к выкладке: $(find _site -type f | wc -l)"

      # ---------- 1. SFTP ----------
      - name: Подготовить папку сайта по SSH
        id: ssh
        if: env.METHOD == 'auto' || env.METHOD == 'sftp'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          script: |
            echo "HOME=$HOME"; ls -d "$HOME"/www "$HOME"/data/www 2>/dev/null
            mkdir -p "$HOME/${{ env.SITE_PATH }}" && echo "OK: $HOME/${{ env.SITE_PATH }}"

      - name: Выложить по SFTP
        id: sftp
        if: env.METHOD == 'auto' || env.METHOD == 'sftp'
        continue-on-error: ${{ env.METHOD == 'auto' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          source: "_site/*"
          target: ${{ env.SITE_PATH }}
          strip_components: 1
          overwrite: true
          timeout: 60s
          command_timeout: 20m

      # ---------- 2. FTP ----------
      - name: Выложить по FTP
        id: ftp
        if: env.METHOD == 'ftp' || (env.METHOD == 'auto' && steps.sftp.outcome != 'success')
        continue-on-error: ${{ env.METHOD == 'auto' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: /${{ env.SITE_PATH }}/
          local-dir: ./_site/
          timeout: 60000

      # ---------- 3. FTPS ----------
      - name: Выложить по FTPS
        id: ftps
        if: env.METHOD == 'ftps' || (env.METHOD == 'auto' && steps.sftp.outcome != 'success' && steps.ftp.outcome != 'success')
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /${{ env.SITE_PATH }}/
          local-dir: ./_site/
          timeout: 60000

      - name: Итог
        if: always()
        run: |
          echo "sftp: ${{ steps.sftp.outcome }} | ftp: ${{ steps.ftp.outcome }} | ftps: ${{ steps.ftps.outcome }}"
          for s in "${{ steps.sftp.outcome }}" "${{ steps.ftp.outcome }}" "${{ steps.ftps.outcome }}"; do
            [ "$s" = "success" ] && { echo "✅ Сайт выложен."; exit 0; }
          done
          echo "❌ Ни один способ не сработал — см. логи шагов выше."; exit 1
