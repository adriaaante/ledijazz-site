# Автодеплой: после push в main GitHub вызывает deploy.php на сайте,
# а тот сам скачивает свежий main с GitHub и раскладывает файлы.
# Секрет DEPLOY_TOKEN — тот же токен, чей SHA-256 записан в deploy.php.
# Переменная DEPLOY_URL (необязательно) — адрес deploy.php,
# по умолчанию https://ledijazz.ru/deploy.php

name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ledijazz
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Попросить сайт обновиться с GitHub
        env:
          URL: ${{ vars.DEPLOY_URL || 'https://ledijazz.ru/deploy.php' }}
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::Нет секрета DEPLOY_TOKEN"; exit 1; }
          echo "→ $URL"
          code=$(curl -sS -o resp.txt -w '%{http_code}' --max-time 300 -X POST -H "X-Deploy-Token: $TOKEN" "$URL") || code=000
          cat resp.txt; echo
          [ "$code" = "200" ] || { echo "::error::deploy.php ответил HTTP $code"; exit 1; }
